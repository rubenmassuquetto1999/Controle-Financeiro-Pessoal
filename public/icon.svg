<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Rounded Square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner Blue Icon Container -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="url(#blueGrad)" />

  <!-- Phi Symbol (Φ) -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Vertical Line -->
    <line x1="256" y1="124" x2="256" y2="388" />
    <!-- Center Ellipse / Ring -->
    <ellipse cx="256" cy="256" rx="90" ry="70" />
  </g>
</svg>
